include: package:flutter_lints/flutter.yaml

analyzer:
  exclude:
    - build/**
    - android/**
    - ios/**
    - web/**
    - windows/**
    - macos/**
    - linux/**

formatter:
  page_width: 80
  trailing_commas: automate

linter:
  rules:
    - directives_ordering
    - prefer_relative_imports
    - prefer_single_quotes
