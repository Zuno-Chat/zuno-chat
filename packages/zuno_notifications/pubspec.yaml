name: zuno_notifications
description: >
  Zuno's Android notification natives: the CallStyle ring with its native
  sound and vibration, message vibration, conversation shortcuts (so message
  notifications count as conversations on Android 11+), client leases and
  the wake locks headless notification actions hold. A real plugin rather
  than a hand-attached channel so it is auto-registered on every
  FlutterEngine, including the headless ones a push or a notification action
  runs on. Not published; internal to the Zuno app.
version: 0.0.1
publish_to: none

environment:
  sdk: ^3.13.4
  flutter: '>=3.3.0'

dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  plugin:
    platforms:
      android:
        package: im.zuno.chat.zuno_notifications
        pluginClass: ZunoNotificationsPlugin
