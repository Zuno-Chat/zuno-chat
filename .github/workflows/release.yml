name: release

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: Build and validate without shipping (rc/dry-run only)
        type: boolean
        default: false

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  prepare:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      version: ${{ steps.guard.outputs.version }}
      build_number: ${{ steps.guard.outputs.build_number }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with:
          channel: stable
          flutter-version: 3.47.5
          cache: true
      - id: guard
        env:
          BRANCH: ${{ github.ref_name }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          if [ "$DRY_RUN" = true ]; then
            version=$(dart tool/release/cli.dart guard --dry-run "$BRANCH")
          else
            version=$(dart tool/release/cli.dart guard "$BRANCH")
          fi
          build_number=$(dart tool/release/cli.dart build-number "$version")
          {
            echo "version=$version"
            echo "build_number=$build_number"
          } >>"$GITHUB_OUTPUT"

  checks:
    needs: prepare
    uses: ./.github/workflows/checks.yml

  build-android:
    needs: [prepare, checks]
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    environment: release
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with:
          channel: stable
          flutter-version: 3.47.5
          cache: true
      - env:
          DOTENV: ${{ secrets.DOTENV }}
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          printf '%s\n' "$DOTENV" >.env
          grep -Eq '^SENTRY_DSN="?https://' .env || { echo "DOTENV has no SENTRY_DSN; the release would ship without crash reporting." >&2; exit 1; }
          printf '%s' "$GOOGLE_SERVICES_JSON" >android/app/google-services.json
          jq -e '.project_info.project_id' android/app/google-services.json >/dev/null || { echo "GOOGLE_SERVICES_JSON is missing or invalid; the release would ship without FCM push." >&2; exit 1; }
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode >"$RUNNER_TEMP/upload.jks"
          test -s "$RUNNER_TEMP/upload.jks" || { echo "ANDROID_KEYSTORE_BASE64 is empty." >&2; exit 1; }
          printf 'storeFile=%s\nstorePassword=%s\nkeyAlias=%s\nkeyPassword=%s\n' \
            "$RUNNER_TEMP/upload.jks" "$KEYSTORE_PASSWORD" "$KEY_ALIAS" "$KEY_PASSWORD" >android/key.properties
          dart tool/release/cli.dart bump "$VERSION"
      - run: flutter build appbundle --release --dart-define-from-file=.env
      - run: flutter build apk --release --dart-define-from-file=.env
      - run: dart tool/ci/forbidden_apis.dart build/app/outputs/bundle/release/app-release.aab build/app/outputs/flutter-apk/app-release.apk
      - env:
          CERT_SHA256: ${{ vars.ANDROID_CERT_SHA256 }}
        run: |
          apksigner=$(find "$ANDROID_HOME/build-tools" -name apksigner | sort -V | tail -n1)
          actual=$("$apksigner" verify --print-certs build/app/outputs/flutter-apk/app-release.apk | sed -n 's/^Signer #[0-9]* certificate SHA-256 digest: //p')
          expected=$(printf '%s' "$CERT_SHA256" | tr -d ':' | tr 'A-F' 'a-f')
          [ -n "$expected" ] && [ "$actual" = "$expected" ] || { echo "The APK is not signed with ANDROID_CERT_SHA256; the website would serve an APK that cannot update existing installs." >&2; exit 1; }
      - uses: actions/upload-artifact@v7
        with:
          name: android
          path: build/app/outputs/bundle/release/app-release.aab
          retention-days: 7
          if-no-files-found: error
      - uses: actions/upload-artifact@v7
        with:
          name: apk
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 7
          if-no-files-found: error

  build-ios:
    needs: [prepare, checks]
    runs-on: xcode-27
    timeout-minutes: 60
    environment: release
    steps:
      - uses: actions/checkout@v7
      - uses: maxim-lobanov/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90
        with:
          xcode-version: '27.0'
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with:
          channel: stable
          flutter-version: 3.47.5
          cache: true
      - uses: ruby/setup-ruby@651ff0d62c5c79bed6d53ec518387aae20e72c1a
        with:
          bundler-cache: true
      - env:
          DOTENV: ${{ secrets.DOTENV }}
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          printf '%s\n' "$DOTENV" >.env
          grep -Eq '^SENTRY_DSN="?https://' .env || { echo "DOTENV has no SENTRY_DSN; the release would ship without crash reporting." >&2; exit 1; }
          dart tool/release/cli.dart bump "$VERSION"
      - env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8_BASE64: ${{ secrets.ASC_KEY_P8_BASE64 }}
          MATCH_GIT_URL: ${{ secrets.MATCH_GIT_URL }}
          MATCH_GIT_BASIC_AUTHORIZATION: ${{ secrets.MATCH_GIT_BASIC_AUTHORIZATION }}
          MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}
        run: |
          printf '%s' "$MATCH_GIT_BASIC_AUTHORIZATION" | base64 --decode 2>/dev/null | grep -Eq '^[^:]+:.+' || { echo "MATCH_GIT_BASIC_AUTHORIZATION must be base64 of username:token, with no 'Basic ' prefix." >&2; exit 1; }
          bundle exec fastlane ios signing
      - run: flutter build ipa --release --dart-define-from-file=.env --export-options-plist=ios/ExportOptions.plist
      - run: dart tool/ci/forbidden_apis.dart build/ios/ipa/*.ipa
      - uses: actions/upload-artifact@v7
        with:
          name: ios
          path: build/ios/ipa/*.ipa
          retention-days: 7
          if-no-files-found: error

  tag:
    needs: [prepare, build-android, build-ios]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - if: ${{ !inputs.dry_run }}
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git tag --annotate "v$VERSION" --message "Zuno $VERSION" "$GITHUB_SHA"
          git push origin "v$VERSION"

  upload-website:
    needs: [prepare, tag]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: release
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: apk
          path: ${{ runner.temp }}/apk
      - env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          AWS_ENDPOINT_URL: https://${{ secrets.R2_ACCOUNT_ID }}.r2.cloudflarestorage.com
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          VERSION: ${{ needs.prepare.outputs.version }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          dir=android
          [ "$DRY_RUN" = true ] && dir=dry-run
          apk="$RUNNER_TEMP/apk/app-release.apk"
          name="zuno-$VERSION.apk"
          jq -n --arg version "$VERSION" --arg apk "$name" \
            --arg sha256 "$(sha256sum "$apk" | cut -d' ' -f1)" --argjson size "$(stat -c %s "$apk")" \
            '{version: $version, apk: $apk, sha256: $sha256, size: $size}' >"$RUNNER_TEMP/latest.json"
          aws s3 cp "$apk" "s3://$R2_BUCKET/$dir/$name" \
            --content-type application/vnd.android.package-archive \
            --cache-control 'public, max-age=31536000, immutable'
          aws s3 cp "$RUNNER_TEMP/latest.json" "s3://$R2_BUCKET/$dir/latest.json" \
            --content-type application/json --cache-control no-cache
          if [ "$DRY_RUN" = true ]; then
            aws s3 rm --recursive "s3://$R2_BUCKET/dry-run/"
          fi

  upload-ios:
    needs: [prepare, upload-website]
    runs-on: xcode-27
    timeout-minutes: 120
    environment: release
    steps:
      - uses: actions/checkout@v7
      - uses: maxim-lobanov/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90
        with:
          xcode-version: '27.0'
      - uses: ruby/setup-ruby@651ff0d62c5c79bed6d53ec518387aae20e72c1a
        with:
          bundler-cache: true
      - uses: actions/download-artifact@v8
        with:
          name: ios
          path: ${{ runner.temp }}/ios
      - env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8_BASE64: ${{ secrets.ASC_KEY_P8_BASE64 }}
          VERSION: ${{ needs.prepare.outputs.version }}
          BUILD_NUMBER: ${{ needs.prepare.outputs.build_number }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          ipa=$(ls "$RUNNER_TEMP"/ios/*.ipa)
          bundle exec fastlane ios upload ipa:"$ipa" version:"$VERSION" \
            build_number:"$BUILD_NUMBER" dry_run:"$DRY_RUN"

  upload-android:
    needs: [prepare, upload-ios]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment: release
    steps:
      - uses: actions/checkout@v7
      - uses: ruby/setup-ruby@651ff0d62c5c79bed6d53ec518387aae20e72c1a
        with:
          bundler-cache: true
      - uses: actions/download-artifact@v8
        with:
          name: android
          path: ${{ runner.temp }}/android
      - env:
          PLAY_JSON: ${{ secrets.PLAY_JSON }}
          VERSION: ${{ needs.prepare.outputs.version }}
          BUILD_NUMBER: ${{ needs.prepare.outputs.build_number }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          bundle exec fastlane android upload aab:"$RUNNER_TEMP/android/app-release.aab" \
            version:"$VERSION" build_number:"$BUILD_NUMBER" dry_run:"$DRY_RUN"
