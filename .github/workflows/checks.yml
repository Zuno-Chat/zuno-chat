name: checks

on:
  workflow_call:
    inputs:
      coverage:
        type: boolean
        default: false
    secrets:
      CODECOV_TOKEN:
        required: false

permissions:
  contents: read

jobs:
  analyze-test:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with:
          channel: stable
          flutter-version: 3.47.5
          cache: true
      - run: flutter pub get
      - run: dart pub get
        working-directory: tool/zuno_lints
      - run: dart analyze --fatal-infos
        working-directory: tool/zuno_lints
      - run: dart test
        working-directory: tool/zuno_lints
      - run: dart analyze --fatal-infos
      - run: |
          flutter test --file-reporter json:build/test-report.json ${{ inputs.coverage && '--coverage' || '' }} || {
            dart tool/ci/failed_tests.dart build/test-report.json | tee -a "$GITHUB_STEP_SUMMARY"
            exit 1
          }
      - if: inputs.coverage
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          slug: Zuno-Chat/zuno-chat
          files: coverage/lcov.info
          fail_ci_if_error: true

  kotlin-test:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with:
          channel: stable
          flutter-version: 3.47.5
          cache: true
      - run: flutter pub get
      - run: flutter build apk --config-only
      - working-directory: android
        run: ./gradlew :app:testDebugUnitTest

  swift-test:
    runs-on: xcode-27
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: maxim-lobanov/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90
        with:
          xcode-version: '27.0'
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with:
          channel: stable
          flutter-version: 3.47.5
          cache: true
      - run: flutter pub get
      - run: flutter build ios --config-only --no-codesign
      - run: |
          udid=$(xcrun simctl list devices available --json | jq -r '[.devices | to_entries | map(select(.key | test("iOS"))) | sort_by(.key | [scan("[0-9]+") | tonumber]) | .[].value[] | select(.name | startswith("iPhone"))] | last | .udid')
          xcrun simctl bootstatus "$udid" -b
          xcodebuild -workspace ios/Runner.xcworkspace -scheme Runner \
            -only-testing:RunnerTests -destination "id=$udid" -parallel-testing-enabled NO \
            -collect-test-diagnostics never test
