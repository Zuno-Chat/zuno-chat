name: checks

on:
  workflow_call:
    inputs:
      ref:
        type: string
        default: ''
      coverage:
        type: boolean
        default: false
    secrets:
      CODECOV_TOKEN:
        required: false

permissions:
  contents: read

jobs:
  analyze-test:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.5
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test ${{ inputs.coverage && '--coverage' || '' }}
      - if: inputs.coverage
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          slug: Zuno-Chat/zuno-chat
          files: coverage/lcov.info
          fail_ci_if_error: true

  kotlin-test:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.5
          cache: true
      - run: flutter pub get
      - run: flutter build apk --config-only
      - working-directory: android
        run: ./gradlew :app:testDebugUnitTest

  swift-test:
    runs-on: xcode-27
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '27.0'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.5
          cache: true
      - run: flutter pub get
      - run: flutter build ios --config-only --no-codesign
      - working-directory: ios
        run: pod install
      - run: |
          udid=$(xcrun simctl list devices available --json | jq -r '[.devices | to_entries | map(select(.key | test("iOS"))) | sort_by(.key | [scan("[0-9]+") | tonumber]) | .[].value[] | select(.name | startswith("iPhone"))] | last | .udid')
          xcrun simctl bootstatus "$udid" -b
          xcodebuild -workspace ios/Runner.xcworkspace -scheme Runner \
            -only-testing:RunnerTests -destination "id=$udid" -parallel-testing-enabled NO \
            -collect-test-diagnostics never test
