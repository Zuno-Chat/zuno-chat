version: 2

updates:
  - package-ecosystem: pub
    directories:
      - /
      - /packages/*
    schedule:
      interval: weekly
      day: monday
    commit-message:
      prefix: chore
      include: scope
    groups:
      pub:
        patterns: ['*']
        update-types: [minor, patch]

  - package-ecosystem: gradle
    directories:
      - /android
      - /packages/*/android
    schedule:
      interval: weekly
      day: monday
    commit-message:
      prefix: chore
      include: scope
    groups:
      gradle:
        patterns: ['*']
        update-types: [minor, patch]

  - package-ecosystem: bundler
    directory: /
    schedule:
      interval: weekly
      day: monday
    commit-message:
      prefix: chore
      include: scope
    groups:
      bundler:
        patterns: ['*']

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    commit-message:
      prefix: chore
      include: scope
    groups:
      actions:
        patterns: ['*']
